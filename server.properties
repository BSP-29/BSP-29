# Legacy Brawl Server keys. Nothing in this codebase reads them.
max-tick-time=60000
player-idle-timeout=10
view-distance=10
simulation-distance=5

# Keys read by the code. Values here override the built-in defaults in
# Configuration.py, and Configuration.py logs every override at startup.
TCPHost=0.0.0.0
TCPPort=9339
UDPHost=0.0.0.0
UDPPort=9339

# The address handed to clients in 24112 ClientInfoMessage. If this does not
# resolve to the machine running the server, battles never get vision frames.
UDPServerAddress=bsp67.dedyn.io

DisableNagle=True
PrintEnabled=True

# Set to false when every client plays matches locally as offline practice and
# never reads the UDP vision stream. The 20 Hz tick loop still accepts datagrams
# but stops simulating characters and stops sending vision frames.
RunBattleSimulation=True

# Team slots advertised in 24124. The v29 reference sends 3. No reference ever
# sends the disabled bot slot list, so anything above 1 makes the client draw
# bot slots that nothing can switch off. Set this to 1 to keep them away.
TeamCapacity=3

# Sends 24130 TeamGameStartingMessage before the 20559 loading screen.
# It was a string placeholder, so this is new. The payload was reconstructed
# from the v29 reference but could not be verified against a real client. It is
# the first packet the v29 reference sends when starting a game, before the
# matchmaking request and the loading screen, so it is on by default.
SendTeamGameStarting=False

# Send 24112 (the UDP endpoint) right after the 20559 loading screen. This
# diverges from the v29 reference, which only answers 24112 in reply to a 10177.
# It is on because the Android client measured does not start the match without
# it: it waits for the endpoint and never gets to the point where it would ask,
# so no 10177 arrives and no UDP socket is opened. Set false to compare against
# the reference behaviour.
SendUdpInfoWithLoading=True

# Resolve UDPServerAddress to a literal IP here on the server, so the client is
# handed an IP and never has to resolve anything itself. Emulators and locked
# down networks often will not answer for the domain, and the client then stalls
# waiting for a UDP endpoint it cannot connect to. Set false to put the raw
# configured value on the wire, hostname and all.
ResolveClientAddress=True

# Send a UDP datagram to the client's TCP address and port right after 24112,
# instead of waiting for the client to open with one as the reference does. A
# NAT holds no mapping for a client that has sent nothing, so this cannot open
# the conversation on a home router, but a reply proves the path is open and
# hands us the client's real UDP port. Set false once the client does open.
ProbeClientUdp=False

# Tell the client in 20559 that it is only spectating. Leave this false: the v29
# reference assigns SpectateMode exactly once, in the spectate branch, and never
# in normal matchmaking. A client that thinks it is watching never takes
# control, never sends inputs and never asks for the UDP endpoint with 10177,
# so the entire handshake never starts. It is printed on every match start so
# the value in force is visible.
SpectateMode=False

# The lookup above is redone every time a client is handed the endpoint, and
# nothing is cached in between, so a dynamic name tracks the current address.
# UdpDnsResolver is the resolver to ask, over plain UDP, so the answer bypasses
# the OS cache which could otherwise serve a stale entry after the address
# changed. Set it to system to use the resolver the OS is configured with
# instead, at the cost of that cache. UdpDnsTimeout is in milliseconds and bounds
# the wait on a battle start; it only costs anything when the resolver itself is
# unreachable, in which case the system resolver answers instead.
UdpDnsResolver=1.1.1.1
UdpDnsTimeout=1500

# Which location goes into 20559 and 24130. Accepts an index or a location name.
# The old default was index 1, which is Wanted3 and is flagged Disabled: the
# client does not have that location and showed its own default map instead,
# which is why a Bounty battle came up as the default Heist map. Index 4 is
# Wanted6, enabled, BountyHunter, with its own tilemap. Only 59 of the 296
# locations are enabled. Set empty to let the room's own mapID decide.
BattleLocation=122

# Send 20405, which drives the searching UI, when the match starts. The v29
# reference declares SEARCH_TIMEOUT = 0, so its matchmaking slot starts the game
# on the first tick with a partly filled queue and empties the queue, and 20405
# is never sent on that tick. Sending it here puts the client into the searching
# state and immediately tells it the match began. Set true to compare.
SendMatchmakingStatus=True

# Bisection. When true the matchmaking status is sent and the battle is not
# started at all, so the client receives 20405 and no 24130, no 20559 and no
# UDP. A screen that still stalls here is not caused by the battle packets.
SkipBattleStart=False

# Diagnostic packet dumps. With DumpPackets=True, every id listed in
# DumpMessageIds is printed as hex before encryption, together with a field list
# recorded by the encoder itself rather than re-parsed from the bytes.
DumpPackets=True
DumpMessageIds=20559,24112,24130

